name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0  # Descomente apenas se usar datas de modificação via git log (Quartz GitDate plugin)
          fetch-depth: 1    # Apenas o commit mais recente — muito mais rápido em repos com histórico longo

      - uses: actions/setup-node@v7
        with:
          node-version: 24  # Active LTS em 2026
          cache: "npm"      # Cache integrado do setup-node — substitui o passo separado de cache ~/.npm

      - name: Cache Quartz plugins
        id: cache-plugins 
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        if: steps.cache-plugins.outputs.cache-hit != 'true'   # ← pular se cache hit
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5